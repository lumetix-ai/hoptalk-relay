[supervisord]
nodaemon = true
logfile = /dev/null
logfile_maxbytes = 0
loglevel = info
pidfile = /tmp/supervisord.pid
childlogdir = /tmp

# Two processes, so one crash never takes the panel down, and four threads each for the
# HTMX polling of an open tab. Without --no-control-socket gunicorn creates a control
# socket in the home directory. The graceful timeout stays below stopwaitsecs, which stays
# below the Compose stop_grace_period.
[program:gunicorn]
command = gunicorn hoptalk_relay.wsgi:application
    --bind unix:/run/app/gunicorn.sock
    --worker-class gthread --workers 2 --threads 4
    --graceful-timeout 20 --timeout 60
    --no-control-socket
    --access-logfile - --error-logfile -
directory = /app
autostart = true
autorestart = true
startsecs = 3
stopsignal = TERM
stopwaitsecs = 25
priority = 10
stdout_logfile = /dev/fd/1
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/fd/2
stderr_logfile_maxbytes = 0

[program:nginx]
command = /usr/sbin/nginx -g "daemon off;"
autostart = true
autorestart = true
startsecs = 3
stopsignal = QUIT
stopwaitsecs = 25
priority = 20
stdout_logfile = /dev/fd/1
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/fd/2
stderr_logfile_maxbytes = 0
