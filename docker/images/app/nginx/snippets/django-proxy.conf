# Django sets these headers too. security-headers.conf is the one place that decides them,
# so a response never carries two different values of the same header.
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Cross-Origin-Opener-Policy;

proxy_set_header Host $http_host;
# Replaces whatever the client sent: the panel throttles sign-in attempts per address, and
# an address the client could choose would let it pick its own throttle key.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_redirect off;
proxy_pass http://django;
