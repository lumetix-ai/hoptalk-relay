worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    types_hash_max_size 4096;

    # The panel only ever posts forms and pasted contact cards.
    client_max_body_size 1m;
    client_body_buffer_size 64k;
    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout 60s;
    keepalive_timeout 65s;

    client_body_temp_path /var/cache/nginx/client_body;
    fastcgi_temp_path /var/cache/nginx/fastcgi;
    proxy_temp_path /var/cache/nginx/proxy;
    scgi_temp_path /var/cache/nginx/scgi;
    uwsgi_temp_path /var/cache/nginx/uwsgi;

    log_format application '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                           '"$http_user_agent" rt=$request_time';
    access_log /dev/stdout application;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
