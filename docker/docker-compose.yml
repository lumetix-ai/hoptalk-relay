name: hoptalk-relay

x-database-connection: &database-connection
    POSTGRES_HOST: database
    POSTGRES_PORT: "5432"
    POSTGRES_DB: ${POSTGRES_DB:-hoptalk_relay}
    POSTGRES_USER: ${POSTGRES_USER:-hoptalk_relay}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in docker/.env}

# Only the worker opens the node, but the app container runs the management commands, and
# verify_configuration there has to report and check the connection the worker uses.
x-node-connection: &node-connection
    MESHCORE_TRANSPORT: ${MESHCORE_TRANSPORT:-tcp}
    MESHCORE_TCP_HOST: ${MESHCORE_TCP_HOST:-host.docker.internal}
    MESHCORE_TCP_PORT: ${MESHCORE_TCP_PORT:-5055}

services:

    app:
        build:
            context: ..
            dockerfile: ./docker/images/app/Dockerfile
            target: ${APP_BUILD_TARGET:-app-production}
            args:
                APP_UID: ${APP_UID:-1000}
                APP_GID: ${APP_GID:-1000}
                PYTHON_VERSION: ${PYTHON_VERSION:-3.14.7}
                NODE_VERSION: ${NODE_VERSION:-24}
        image: ${HOPTALK_COMPOSE_PROJECT_NAME:-hoptalk-relay}-app:${APP_IMAGE_TAG:-latest}
        restart: unless-stopped
        init: true
        # Longer than gunicorn's graceful timeout and supervisord's stop wait, so every
        # request in flight finishes before Compose resorts to SIGKILL.
        stop_grace_period: 30s
        # nginx, gunicorn and supervisord all run as the image's ordinary account and listen on
        # ports above 1024, so no capability is needed.
        cap_drop:
            -   ALL
        security_opt:
            -   "no-new-privileges:true"
        environment:
            <<: [*database-connection, *node-connection]
            APP_ROLE: web
            DJANGO_DEBUG: "false"
            SERVER_ADDRESS: ${SERVER_ADDRESS:-}
            HTTPS_PORT: ${HTTPS_PORT:-443}
        # IPv4 only: the certificate names IPv4 addresses alone, and on Linux an IPv6 connection
        # reaches the container through docker-proxy, which hides the client's address from the
        # sign-in throttle.
        ports:
            -   "0.0.0.0:${HTTP_PORT:-80}:8080"
            -   "0.0.0.0:${HTTPS_PORT:-443}:8443"
        volumes:
            # Mounted rather than injected as environment. Compose expands a bare dollar
            # sign, and an Argon2 hash is full of them; the application parses the file
            # itself, without any expansion.
            -   ../src/.env:/app/.env:ro
            -   ../var/tls:/etc/nginx/tls:ro
        depends_on:
            database:
                condition: service_healthy

    relay:
        # The image the app service builds; a build definition here as well would build the
        # same tag twice. It is in no registry, so Compose never tries to pull it.
        image: ${HOPTALK_COMPOSE_PROJECT_NAME:-hoptalk-relay}-app:${APP_IMAGE_TAG:-latest}
        pull_policy: never
        restart: unless-stopped
        init: true
        # The worker records the frames it already took from the node and closes the link
        # before it exits, which takes up to 25 seconds.
        stop_grace_period: 30s
        command: ["python", "manage.py", "run_relay"]
        # The worker runs as an ordinary account and needs no capability, whichever transport it uses.
        cap_drop:
            -   ALL
        security_opt:
            -   "no-new-privileges:true"
        environment:
            <<: [*database-connection, *node-connection]
            APP_ROLE: relay
            DJANGO_DEBUG: "false"
            SERVER_ADDRESS: ${SERVER_ADDRESS:-}
        # Docker Desktop resolves host.docker.internal by itself; Linux needs this entry.
        extra_hosts:
            -   "host.docker.internal:host-gateway"
        volumes:
            -   ../src/.env:/app/.env:ro
        # The image's health check probes the web server, which this service does not run.
        healthcheck:
            disable: true
        depends_on:
            database:
                condition: service_healthy

    database:
        image: postgres:18.6-trixie
        restart: unless-stopped
        # PostgreSQL stops on SIGINT with a fast shutdown, which can take longer than the
        # ten seconds Compose waits by default.
        stop_grace_period: 60s
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-hoptalk_relay}
            POSTGRES_USER: ${POSTGRES_USER:-hoptalk_relay}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in docker/.env}
        volumes:
            # PostgreSQL 18 images keep their data under /var/lib/postgresql/18/docker and
            # refuse to start with a volume at the old /var/lib/postgresql/data.
            -   ../var/database:/var/lib/postgresql
        healthcheck:
            # Over TCP: on first initialisation the image runs a temporary server that
            # listens on the Unix socket only, and a socket probe would pass too early.
            test: ["CMD-SHELL", "pg_isready --host=127.0.0.1 --username=\"$${POSTGRES_USER}\" --dbname=\"$${POSTGRES_DB}\""]
            interval: 5s
            timeout: 3s
            retries: 30
