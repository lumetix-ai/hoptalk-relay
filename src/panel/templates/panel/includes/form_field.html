<div class="space-y-1">
  {% if field.widget_type == "checkbox" %}
    <div class="flex items-start gap-3">
      <div class="flex h-5 items-center">{{ field }}</div>
      <div>
        <label for="{{ field.id_for_label }}" class="label">{{ field.label }}</label>
        {% if help_text %}<p class="help-text">{{ help_text }}</p>{% endif %}
      </div>
    </div>
  {% else %}
    <label for="{{ field.id_for_label }}" class="label">{{ field.label }}</label>
    {{ field }}
    {% if help_text %}<p class="help-text">{{ help_text }}</p>{% endif %}
  {% endif %}
  {% for error in field.errors %}<p class="field-error" role="alert">{{ error }}</p>{% endfor %}
</div>
